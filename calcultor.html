<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Definite Integral Calculator</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>
    <style>
        :root {
            --primary-color: #3182ce;
            --bg-color: #f7fafc;
            --card-bg: #ffffff;
            --text-color: #2d3748;
            --border-color: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        h1 {
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 20px;
            text-align: center;
            color: #1a202c;
        }

        .calculator-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 768px) {
            .calculator-layout {
                grid-template-columns: 350px 1fr;
            }
        }

        .control-panel {
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: #f8fafc;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-weight: 600;
            font-size: 0.85rem;
            color: #4a5568;
        }

        input {
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.15);
        }

        .limits-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .result-box {
            margin-top: 10px;
            padding: 15px;
            background: #ebf8ff;
            border-left: 4px solid var(--primary-color);
            border-radius: 4px;
        }

        .result-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #2b6cb0;
            font-weight: bold;
        }

        .result-value {
            font-size: 1.6rem;
            font-weight: bold;
            color: #2b6cb0;
            margin-top: 5px;
        }

        .error-message {
            color: #e53e3e;
            background: #fff5f5;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.9rem;
            display: none;
            border: 1px solid #fed7d7;
        }

        .chart-container {
            position: relative;
            min-height: 300px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            background: #ffffff;
        }

        .math-hint {
            font-size: 0.75rem;
            color: #718096;
            margin-top: 2px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Definite Integral Calculator & Visualizer</h1>
    
    <div class="calculator-layout">
        <div class="control-panel">
            <div class="input-group">
                <label for="function-input">Function f(x)</label>
                <input type="text" id="function-input" value="x^2 - 2x">
                <div class="math-hint">Examples: x^2, sin(x), exp(x), 1/x</div>
            </div>

            <div class="limits-group">
                <div class="input-group">
                    <label for="limit-a">Lower Limit (a)</label>
                    <input type="number" id="limit-a" value="0" step="any">
                </div>
                <div class="input-group">
                    <label for="limit-b">Upper Limit (b)</label>
                    <input type="number" id="limit-b" value="3" step="any">
                </div>
            </div>

            <div id="error-box" class="error-message"></div>

            <div class="result-box">
                <div class="result-title">Definite Integral Value</div>
                <div id="result-display" class="result-value">0.0000</div>
            </div>
        </div>

        <div class="chart-container">
            <canvas id="graphCanvas"></canvas>
        </div>
    </div>
</div>

<script>
    // Initialize global chart variable
    let myChart = null;

    // Grab elements
    const functionInput = document.getElementById('function-input');
    const limitAInput = document.getElementById('limit-a');
    const limitBInput = document.getElementById('limit-b');
    const resultDisplay = document.getElementById('result-display');
    const errorBox = document.getElementById('error-box');

    // Attach listeners for instant feedback
    functionInput.addEventListener('input', calculateAndPlot);
    limitAInput.addEventListener('input', calculateAndPlot);
    limitBInput.addEventListener('input', calculateAndPlot);

    // Initial run on window load
    window.onload = function() {
        calculateAndPlot();
    };

    function calculateAndPlot() {
        // Clear errors
        errorBox.style.display = 'none';
        errorBox.innerText = '';

        const exprString = functionInput.value.trim();
        const a = parseFloat(limitAInput.value);
        const b = parseFloat(limitBInput.value);

        if (!exprString) {
            resultDisplay.innerText = "0.0000";
            return;
        }

        if (isNaN(a) || isNaN(b)) {
            showError("Please enter valid numerical bounds for a and b.");
            return;
        }

        try {
            // Compile expression via Math.js
            const compiledExpr = math.compile(exprString);

            // 1. Calculate the Riemann Integral (Simpson's Rule for clean convergence)
            const steps = 1000; 
            const integralVal = simpsonsRule(compiledExpr, a, b, steps);
            
            // Display formatted result
            if (isNaN(integralVal) || !isFinite(integralVal)) {
                resultDisplay.innerText = "Undefined";
            } else {
                resultDisplay.innerText = Number(integralVal.toFixed(5)).toString();
            }

            // 2. Generate Data Points for Chart rendering
            // Dynamically pad view window outside limits a & b for context (similar to Desmos)
            const span = Math.abs(b - a) || 4;
            const viewMin = Math.min(a, b) - span * 0.5;
            const viewMax = Math.max(a, b) + span * 0.5;

            const graphSteps = 200;
            const stepSize = (viewMax - viewMin) / graphSteps;

            const linePoints = [];
            const filledPoints = [];

            for (let i = 0; i <= graphSteps; i++) {
                const x = viewMin + i * stepSize;
                let y;
                try {
                    y = compiledExpr.evaluate({ x: x });
                } catch(e) {
                    y = null;
                }

                if (typeof y === 'number' && isFinite(y)) {
                    linePoints.push({ x: x, y: y });

                    // Check if x lies within the lower and upper bounds of integration
                    const minBound = Math.min(a, b);
                    const maxBound = Math.max(a, b);
                    if (x >= minBound && x <= maxBound) {
                        filledPoints.push({ x: x, y: y });
                    }
                }
            }

            // Update or generate the chart instance
            updateChart(linePoints, filledPoints, a, b);

        } catch (error) {
            showError("Invalid math syntax. Check operators or mismatched parentheses.");
            resultDisplay.innerText = "Error";
        }
    }

    // Numerical integration using Simpson's Rule: (h/3) * [f(x0) + 4f(x1) + 2f(x2) + ... + f(xn)]
    function simpsonsRule(compiledExpr, a, b, n) {
        if (a === b) return 0;
        // Ensure even steps
        if (n % 2 !== 0) n++; 
        
        const h = (b - a) / n;
        let sum = evalF(compiledExpr, a) + evalF(compiledExpr, b);

        for (let i = 1; i < n; i++) {
            const x = a + i * h;
            const coeff = (i % 2 === 0) ? 2 : 4;
            sum += coeff * evalF(compiledExpr, x);
        }

        return (h / 3) * sum;
    }

    // Safely evaluate function at point x
    function evalF(compiledExpr, xVal) {
        try {
            const res = compiledExpr.evaluate({ x: xVal });
            return typeof res === 'number' ? res : NaN;
        } catch(e) {
            return NaN;
        }
    }

    function showError(msg) {
        errorBox.innerText = msg;
        errorBox.style.display = 'block';
    }

    function updateChart(linePoints, filledPoints, a, b) {
        const ctx = document.getElementById('graphCanvas').getContext('2d');

        // Create datasets
        const datasets = [
            {
                label: 'f(x)',
                data: linePoints,
                borderColor: '#4a5568',
                borderWidth: 2,
                pointRadius: 0,
                fill: false,
                showLine: true
            },
            {
                label: 'Integrated Area',
                data: filledPoints,
                backgroundColor: 'rgba(49, 130, 206, 0.3)',
                borderColor: 'transparent',
                pointRadius: 0,
                fill: 'origin', // Fills down to the x-axis (y=0)
                showLine: true
            }
        ];

        if (myChart) {
            myChart.data.datasets = datasets;
            myChart.options.scales.x.min = linePoints[0]?.x;
            myChart.options.scales.x.max = linePoints[linePoints.length - 1]?.x;
            myChart.update('none'); // Quick updates without messy animations
        } else {
            myChart = new Chart(ctx, {
                type: 'scatter',
                data: { datasets: datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        x: {
                            type: 'linear',
                            position: 'bottom',
                            grid: { color: '#e2e8f0' },
                            title: { display: true, text: 'x' }
                        },
                        y: {
                            type: 'linear',
                            grid: { color: '#e2e8f0' },
                            title: { display: true, text: 'y' }
                        }
                    }
                }
            });
        }
    }
</script>

</body>
</html>
